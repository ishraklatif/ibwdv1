[project]
name = "ibwd"
version = "0.1.0"
description = "Persistent structural + semantic codebase memory for AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.18",
    "gitpython>=3.1",
    "pathspec>=0.12",
    "xxhash>=3.4",
    "mcp>=1.2.0",
    "networkx>=3.2",
    "httpx>=0.27",
    # <0.26: py-tree-sitter 0.26.0 segfaults in Node.text under repeated parsing (Python 3.13)
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ibwd = "ibwd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibwd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
